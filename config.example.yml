# Several config files can be merged by listing them in CONFIG_FILE, separated by ':'.

global:
  # Optional. SQLite database of bridged messages and backend state. Default: oxibridge.db
  database: oxibridge.db

  # Optional. Not used yet; will host Telegram avatars for Discord without exposing the bot token.
  r2:
    bucket_name: "oxibridge-avatars"
    account_id: ""
    # Get these from https://dash.cloudflare.com/?to=/:account/r2/api-tokens
    access_key: ""
    secret_key: ""

# Each backend is one account on one platform. Groups refer to backends by name.
backends:
  telegram01:
    kind: telegram
    # Bot token from @BotFather on Telegram
    token: "PLACEHOLDER"
    # API ID and hash from https://my.telegram.org
    api_id: 12345
    api_hash: "PLACEHOLDER"

  discord01:
    kind: discord
    # Needs the Message Content intent, and View Channels, Read Message History, Manage Webhooks (536937472)
    token: "PLACEHOLDER"

  libera:
    kind: irc
    server: irc.libera.chat
    nickname: oxibridge
    # Optional. Defaults to 6697 with TLS and 6667 without
    port: 6697
    # Optional. Default: true
    use_tls: true

# A group bridges one chat of each of its backends.
groups:
  example_group:
    telegram01:
      # Bot API chat ID: supergroups and channels start with -100
      chat: -1001234567890
    discord01:
      channel: 1234567890000
    libera:
      channel: "#oxibridge"
      # Optional for every backend. readonly only reads from this chat, writeonly only writes to it.
      readonly: false
