[package]
name = "kove"
version = "0.1.0"
edition = "2024"
description = "A client for the Kove REST API and gateway"
repository = "https://github.com/itsvic-dev/oxibridge"
license = "GPL-3.0-or-later"
readme = "README.md"
keywords = ["kove", "api", "bot", "gateway"]
categories = ["api-bindings"]

[dependencies]
bytes = "1.10"
futures-util = { version = "0.3.31", default-features = false, features = ["sink", "std"] }
log = "0.4.28"
percent-encoding = "2.3.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0.215", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0"
tokio = { version = "1.48.0", features = ["macros", "time"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
webpki-roots = "1.0"

[dev-dependencies]
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
